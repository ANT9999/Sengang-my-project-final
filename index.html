<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Studio - Products</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background-color: #fcfcfc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Brand Circle Logo */
    .brand-circle {
      width: 65px;
      height: 65px;
      background-color: #ffffff;
      border: 1px solid #777;
      border-radius: 50%;
      background-image: url('l1.png'); /* កែសម្រួលមកប្រើ file l1.png នៅលើ GitHub ផ្ទាល់ */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Navigation Bar */
    .custom-navbar {
      background-color: #e2e2e2;
      border: 1px solid #777;
      border-radius: 40px;
      padding: 10px 40px;
    }

    .nav-link-custom {
      font-size: 1.25rem;
      font-weight: 500;
      text-decoration: none;
      margin: 0 25px;
      color: #0d6efd;
      transition: color 0.2s ease-in-out;
    }

    .nav-link-custom:hover {
      color: #dc3545 !important;
    }

    /* ========================================================
       Custom Auto-sliding Banner
       ======================================================== */
    .banner-container {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 28px;
      overflow: hidden;
      background-color: #e2e2e2;
    }

    .banner-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out;
    }

    .banner-slide.active {
      opacity: 1;
      visibility: visible;
    }

    .banner-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Indicators */
    .banner-dots {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .banner-dot {
      width: 30px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .banner-dot.active {
      background-color: #ffffff;
    }

    /* Product Cards */
    .product-card {
      border: 1px solid #ebebeb;
      border-radius: 16px;
      background: #ffffff;
      padding: 12px;
      height: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    .product-img-box {
      width: 100%;
      height: 110px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f1f1f1;
      margin-bottom: 8px;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0d6efd;
      margin-bottom: 4px;
      transition: color 0.2s ease;
    }

    .product-desc {
      font-size: 0.72rem;
      line-height: 1.35;
      color: #0d6efd;
      margin: 0;
      transition: color 0.2s ease;
    }

    .product-card:hover .product-title,
    .product-card:hover .product-desc {
      color: #dc3545 !important;
    }

    /* Footer Styling */
    footer {
      background-color: #fafafa;
      border-top: 1px solid #ededed;
      font-size: 0.82rem;
    }

    footer a, footer p, footer span, footer strong, footer small, footer li {
      color: #0d6efd;
      transition: color 0.2s ease;
    }

    footer a:hover, footer p:hover, footer span:hover, 
    footer strong:hover, footer small:hover, footer li:hover {
      color: #dc3545 !important;
    }

    .footer-heading {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
      color: #0d6efd;
    }

    .footer-heading:hover {
      color: #dc3545 !important;
    }

    .footer-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-links li {
      margin-bottom: 8px;
    }

    .footer-links a {
      text-decoration: none;
    }
  </style>
</head>
